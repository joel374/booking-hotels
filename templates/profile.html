{% extends "base.html" %}
{% block content %}
<div style="max-width: 500px; margin: 4rem auto">
  <div class="glass" style="padding: 2rem">
    <h2 style="text-align: center; margin-bottom: 2rem">Profile Saya</h2>
    <form method="POST" action="{{ url_for('auth.profile') }}" enctype="multipart/form-data">
      <div style="text-align: center; margin-bottom: 1.5rem;">
          <div style="width: 120px; height: 120px; border-radius: 50%; background: #cbd5e1; margin: 0 auto; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #fff; font-weight: bold; margin-bottom: 1rem;">
              {% if user.photo_url %}
                  <img src="{{ user.photo_url }}" alt="Profile" style="width: 100%; height: 100%; object-fit: cover;">
              {% else %}
                  {{ user.username[0]|upper }}
              {% endif %}
          </div>
          <label for="photo" class="btn" style="background-color: #e2e8f0; color: #475569; cursor: pointer; padding: 0.5rem 1rem; border-radius: 5px; font-weight: 500;">Change Photo</label>
          <input type="file" id="photo" name="photo" style="display: none;" accept="image/*">
      </div>
      <div style="margin-bottom: 1rem">
        <label class="text-muted">Username</label>
        <input type="text" name="username" class="form-control" value="{{ user.username }}" required />
      </div>
      <div style="margin-bottom: 1rem">
        <label class="text-muted">Email</label>
        <input type="email" name="email" class="form-control" value="{{ user.email }}" required />
      </div>
      <div style="margin-bottom: 1rem">
        <label class="text-muted">Phone Number</label>
        <input type="text" name="phone" class="form-control" value="{{ user.phone or '' }}" />
      </div>

      <p style="margin: 1.5rem 0; font-weight: 600; color: #475569">Change password (optional)</p>
      <div style="margin-bottom: 1rem">
        <label class="text-muted">Current Password</label>
        <input type="password" name="current_password" class="form-control" />
      </div>
      <div style="margin-bottom: 1rem">
        <label class="text-muted">New Password</label>
        <input type="password" name="new_password" class="form-control" />
      </div>
      <div style="margin-bottom: 1.5rem">
        <label class="text-muted">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" />
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem">Update Profile</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('photo').addEventListener('change', function(e) {
        if (this.files && this.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const imgContainer = document.querySelector('label[for="photo"]').previousElementSibling;
                imgContainer.innerHTML = '<img src="' + e.target.result + '" alt="Profile" style="width: 100%; height: 100%; object-fit: cover;">';
            }
            reader.readAsDataURL(this.files[0]);
        }
    });
</script>
{% endblock %}
