{% extends "base.html" %} {% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card-header">
      <h2>{{ _("Daftar Akun Baru") }}</h2>
      <p>{{ _("Lengkapi data dasar untuk membuat akun dan mulai pesan hotel dengan lebih cepat.") }}</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="username">{{ _("Nama Pengguna") }}</label>
        <input id="username" type="text" name="username" class="form-control" placeholder="{{ _('Buat username unik') }}" required autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input id="email" type="email" name="email" class="form-control" placeholder="{{ _('contoh: nama@email.com') }}" required autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">{{ _("Nomor Telepon") }}</label>
        <input id="phone" type="text" name="phone" class="form-control" placeholder="081234567890" required autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
      </div>

      <div class="form-group password-group">
        <div class="form-label-row">
          <label class="form-label" for="password">{{ _("Password") }}</label>
          <button type="button" class="password-toggle" id="togglePassword">{{ _("Tampilkan") }}</button>
        </div>
        <input id="password" type="password" name="password" class="form-control" placeholder="{{ _('Minimal 8 karakter') }}" required autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
      </div>

      <div class="form-group password-group">
        <div class="form-label-row">
          <label class="form-label" for="confirm_password">{{ _("Konfirmasi Password") }}</label>
          <button type="button" class="password-toggle" id="toggleConfirmPassword">{{ _("Tampilkan") }}</button>
        </div>
        <input id="confirm_password" type="password" name="confirm_password" class="form-control" placeholder="{{ _('Ketik ulang password Anda') }}" required autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
      </div>

      <button type="submit" class="btn btn-primary btn-block">{{ _("Register") }}</button>
    </form>

    <div class="auth-divider"><span>{{ _("ATAU") }}</span></div>

    <a href="{{ url_for('auth.login_google') }}" class="btn btn-secondary btn-block google-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4" />
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05" />
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335" />
        <path d="M1 1h22v22H1z" fill="none" />
      </svg>
      {{ _("Daftar dengan Google") }}
    </a>

    <p class="auth-footer">
      {{ _("Sudah punya akun?") }} <a href="{{ url_for('auth.login') }}" class="text-link">{{ _("Login di sini") }}</a>
    </p>
  </div>
</div>

<script>
  const passwordInput = document.getElementById('password');
  const togglePassword = document.getElementById('togglePassword');
  const confirmPasswordInput = document.getElementById('confirm_password');
  const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');

  if (togglePassword && passwordInput) {
    togglePassword.addEventListener('click', function() {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.textContent = type === 'password' ? '{{ _("Tampilkan") }}' : '{{ _("Sembunyikan") }}';
    });
  }

  if (toggleConfirmPassword && confirmPasswordInput) {
    toggleConfirmPassword.addEventListener('click', function() {
      const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      confirmPasswordInput.setAttribute('type', type);
      this.textContent = type === 'password' ? '{{ _("Tampilkan") }}' : '{{ _("Sembunyikan") }}';
    });
  }
</script>
{% endblock %}
