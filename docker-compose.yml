services:
  web:
    build: .
    container_name: booking_hotels_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-super_secret_docker_key_2026}
      # Arahkan DB_HOST ke nama container database di bawah
      - DB_HOST=${DB_HOST:-booking_hotels_db}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root_password}
      - DB_NAME=${DB_NAME:-hotel_booking}
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-True}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER:-noreply@bhinekahotels.com}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    volumes:
      - uploads_data:/app/static/uploads
      - session_data:/app/flask_session
    command: sh -c "python run_migrations.py && gunicorn --workers 3 --bind 0.0.0.0:5000 app:app"
    networks:
      - shared_network

  # Ini container yang akan jadi "Global MySQL" lu
  db:
    image: mysql:8.0
    container_name: booking_hotels_db
    restart: unless-stopped
    # Port sengaja gak diekspos ke host biar aman, cukup diakses via internal network
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}  
      MYSQL_DATABASE: hotel_booking
    volumes:
      - booking_db_data:/var/lib/mysql
    networks:
      - shared_network

networks:
  shared_network:
    external: true

volumes:
  uploads_data:
  session_data:
  booking_db_data:  # Wajib ada biar data base gak hilang pas container mati